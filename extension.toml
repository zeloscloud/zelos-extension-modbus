name = "Modbus"
version = "0.2.3"
description = "Read and write Modbus TCP and RTU registers on PLCs, power meters, sensors and SunSpec inverters over TCP/IP or RS232/RS485 serial. Register map files, SunSpec discovery or auto-scan turn registers into signals."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-modbus"
# The marketplace search and Zelos AI find an extension by these words, its name and its description.
keywords = ["modbus", "plc", "scada", "industrial", "automation", "modbus-tcp", "modbus-rtu", "modbustcp", "modbusrtu", "rs-485", "sunspec", "register map", "holding register", "input register", "coil", "discrete input", "solar inverter", "battery", "energy meter", "gateway"]
categories = ["Industrial", "IoT", "Networking", "Automation", "Energy"]
icon = "assets/modbus-icon.png"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[config]
schema = "config.schema.json"

[agent]
runtime = "python"
entry = "main.py"
python_version = "3.11"

[package]
paths = ["main.py", "zelos_extension_modbus", "assets"]
