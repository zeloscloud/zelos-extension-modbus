[project]
name = "zelos-extension-modbus"
version = "0.2.3"
description = "Read and write Modbus TCP and RTU registers on PLCs, power meters, sensors and SunSpec inverters over TCP/IP or RS232/RS485 serial. Register map files, SunSpec discovery or auto-scan turn registers into signals."
authors = [{ name = "Zelos", email = "support@zeloscloud.io" }]
readme = "README.md"
requires-python = ">=3.11"
keywords = ["zelos", "extension", "modbus", "plc", "scada", "industrial"]
dependencies = [
    "zelos-sdk>=0.0.13",
    "pymodbus>=3.11.1",
    "pyserial>=3.5",
    "rich-click>=1.8.1",
    "pysunspec2>=1.3.6",
]

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-modbus"
Repository = "https://github.com/zeloscloud/zelos-extension-modbus"
Issues = "https://github.com/zeloscloud/zelos-extension-modbus/issues"
Documentation = "https://docs.zeloscloud.io/app/extensions/"

[project.scripts]
zelos-extension-modbus = "zelos_extension_modbus.cli.main:cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.5"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_modbus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO"

[tool.ruff]
target-version = 'py311'
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
